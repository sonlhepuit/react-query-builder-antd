name: Publish npm Package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish-npm:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
          package-manager-cache: false

      - name: Use an OIDC-compatible npm CLI
        run: npm install --global "npm@^11.15.0"

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          node -e "const v=require(\"./package.json\").version;
          if(process.env.RELEASE_TAG!==\"v\"+v){throw new Error(\"Release tag \"+process.env.RELEASE_TAG+\" must equal v\"+v)}"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build package
        run: npm run build-npm

      - name: Verify package contents
        run: npm run check-package

      - name: Publish package with npm Trusted Publishing
        run: npm publish --access public
